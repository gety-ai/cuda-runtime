name: Package CUDA Runtime

on:
  workflow_dispatch:
    inputs:
      cuda-version:
        description: "CUDA version (e.g., 12.6.3, 12.8.1)"
        required: true
        default: "12.6.3"
      cudnn-version:
        description: "cuDNN version: 'auto' (latest compatible), specific version, or empty to skip"
        required: false
        default: "auto"
      platforms:
        description: "Platforms to build (JSON array)"
        required: false
        default: '["windows-x86_64", "linux-x86_64"]'
      profile:
        description: "Build profile: full (all libs) or minimal (core libs only)"
        required: false
        type: choice
        options:
          - full
          - minimal
        default: "full"
      create-release:
        description: "Create a GitHub release with the archive"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
      fail-fast: false
    runs-on: ${{ contains(matrix.platform, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    name: Package (${{ matrix.platform }}, ${{ inputs.profile }})

    outputs:
      cuda-version: ${{ steps.build.outputs.cuda-version }}
      cudnn-version: ${{ steps.build.outputs.cudnn-version }}
      profile: ${{ steps.build.outputs.profile }}

    steps:
      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          echo "os=${PLATFORM%%-*}" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM##*-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ./tmp/downloads
          key: cuda-downloads-${{ inputs.cuda-version }}-${{ inputs.cudnn-version }}-${{ matrix.platform }}

      - name: Package CUDA Runtime
        id: build
        shell: bash
        run: |
          deno run -A main.ts \
            --cuda-version "${{ inputs.cuda-version }}" \
            --cudnn-version "${{ inputs.cudnn-version }}" \
            --os "${{ steps.platform.outputs.os }}" \
            --arch "${{ steps.platform.outputs.arch }}" \
            --profile "${{ inputs.profile }}" \
            --output-dir ./output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.archive-name }}
          path: ./output/*

  release:
    if: ${{ inputs.create-release }}
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cuda-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuda-${{ needs.package.outputs.cuda-version }}-cudnn-${{ needs.package.outputs.cudnn-version }}
          name: CUDA ${{ needs.package.outputs.cuda-version }} + cuDNN ${{ needs.package.outputs.cudnn-version }} Runtime (${{ needs.package.outputs.profile }})
          body: |
            CUDA/cuDNN runtime libraries.

            - CUDA: ${{ needs.package.outputs.cuda-version }}
            - cuDNN: ${{ needs.package.outputs.cudnn-version }}
            - Profile: ${{ needs.package.outputs.profile }}
            - Platforms: ${{ inputs.platforms }}
          files: artifacts/*
          draft: false
